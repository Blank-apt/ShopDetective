[project]
name = "shopdetective"
version = "1.0.0"
description = "Connect customer complaints to recorded refunds and decide what to investigate first."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "SIM108", "C408", "UP031"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_data.py" = ["E501"]
"shopdetective/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY and RUN_LIVE_TESTS=1)"]
