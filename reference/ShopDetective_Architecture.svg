<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1500" viewBox="0 0 1320 1500" role="img" aria-labelledby="title desc">
<title id="title">ShopDetective system architecture</title>
<desc id="desc">Proposed hackathon architecture: one Streamlit Python application validates orders and feedback, uses Gemini to classify messages, checks evidence and human corrections, calculates refund metrics, and renders findings with supported action suggestions. Gemini is external and session state is local to the application.</desc>
<rect width="1320" height="1500" fill="#F5F7FC"/>
<text x="60" y="43" text-anchor="start" dominant-baseline="text-before-edge" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#182944">SHOPDETECTIVE</text>
<text x="61" y="99" text-anchor="start" dominant-baseline="text-before-edge" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#566780">System architecture · Proposed hackathon MVP</text>
